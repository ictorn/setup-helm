name: 'setup-helm'
description: 'get a specific Helm release'

inputs:
  version:
    description: 'Helm version to install'
    required: false
    default: 'v4.2.4'
  checksum:
    description: 'expected SHA-256 checksum of the Helm archive'
    required: false
    default: 'c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3'
  os:
    description: 'target OS'
    required: false
    default: 'linux'
  arch:
    description: 'target architecture'
    required: false
    default: 'amd64'

runs:
  using: 'composite'
  steps:
    - name: 'download'
      shell: sh
      run: curl --fail --silent --show-error --location --output "${{ runner.temp }}/helm.tar.gz" "https://get.helm.sh/helm-${{ inputs.version }}-${{ inputs.os }}-${{ inputs.arch }}.tar.gz"        

    - name: 'verify'
      shell: sh
      run: echo "$(echo '${{ inputs.checksum }}' | tr '[:upper:]' '[:lower:]')  ${{ runner.temp }}/helm.tar.gz" | sha256sum -c -

    - name: 'install'
      shell: bash
      run: tar -zxf "${{ runner.temp }}/helm.tar.gz" -C /usr/local/bin --wildcards --strip-components=1 --mode='+x' '*/helm'
